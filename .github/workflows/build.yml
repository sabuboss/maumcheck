name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"    # 매일 09:00 KST — 예약일이 된 검사를 자동 발행
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jinja2
      - run: TZ=Asia/Seoul python build.py
      - name: dist 브랜치로 배포 (Cloudflare Pages가 이 브랜치를 봅니다)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dist
