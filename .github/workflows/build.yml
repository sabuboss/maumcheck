name: build
on:
  push:
    branches: [main]
  schedule:
    # 00:00 정각 UTC는 전 세계 크론이 몰리는 슬롯이라 2~3시간씩 밀리고,
    # 고부하 시간대에는 GitHub이 예약 실행을 건너뛸 수도 있다.
    # 붐비지 않는 분으로 옮겨 둔다. 23:37 UTC = 08:37 KST.
    - cron: "37 23 * * *"   # 매일 08:37 KST 예정 — 예약일이 된 검사와 글을 자동 발행
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jinja2 pillow
      - run: TZ=Asia/Seoul python build.py
      - name: dist 브랜치로 배포 (Cloudflare Pages가 이 브랜치를 봅니다)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: dist
