<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if slug %}{{ title }} | {{ site.name }}{% else %}{{ site.name }} — {{ site.tagline }}{% endif %}</title><meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ site.url }}/{% if slug %}{{ slug }}/{% endif %}"><link rel="stylesheet" href="/static/site.css">
{% if site.adsense_client %}<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense_client }}" crossorigin="anonymous"></script>{% endif %}</head>
<body><div class="top"><div class="in"><a class="brand" href="/">{{ site.name }}</a><nav><a href="/tests/">전체 검사</a><a href="/about/">소개</a></nav></div></div>
<div class="wrap"><h1>{{ title }}</h1>{{ body|safe }}{{ ad|default("")|safe }}</div>
<footer><a href="/about/">소개</a>·<a href="/privacy/">개인정보처리방침</a>·<a href="/contact/">문의</a><br>© {{ year }} {{ site.name }}. 이 사이트의 검사는 참고용이며 전문적 진단을 대신하지 않습니다.</footer>
</body></html>
